server {
    listen 80;
    server_name _;

    location = /favicon.ico { access_log off; log_not_found off; }

    # collectstatic output folder (STATIC_ROOT), not the "static" source folder
    location /static/ {
        alias /home/ubuntu/devops-scaling-app/staticfiles/;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/home/ubuntu/devops-scaling-app/devops.sock;
    }
}
